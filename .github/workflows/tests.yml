name: Unit Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Install dependencies
        run: |
            (cd brackets-json-db && npm install) &
            (cd brackets-memory-db && npm install) &
            (cd brackets-prisma-db && npm install) &
            wait
      - run: npm test
        env:
          FORCE_COLOR: "1"
